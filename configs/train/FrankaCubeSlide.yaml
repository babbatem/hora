seed: ${..seed} # Cube push derived from AllegroHandHora.yaml
algo: PPO
network:
  mlp:
    units: [256, 128, 64]
  priv_mlp:
    units: [32, 32, 8]

load_path: ${..checkpoint} # path to the checkpoint to load

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: ${...task.env.numEnvs}
  normalize_advantage: True
  gamma: 0.99
  tau: 0.95
  learning_rate: 5e-4
  kl_threshold: 0.008
  # PPO batch collection
  horizon_length: 32
  minibatch_size: 16384
  mini_epochs: 5
  # PPO loss setting
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.000
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  # grad clipping
  truncate_grads: True
  grad_norm: 1.0
  # snapshot setting
  save_best_after: 200
  save_frequency: 100
  max_agent_steps: 75000000000  # Increased from 75000000000
  # hora setting
  priv_info: True
  priv_info_dim: 1
  priv_info_embed_dim: 1
  proprio_adapt: True

params:
  config:
    name: ${resolve_default:FrankaCubePush,${....experiment}}